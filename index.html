    function Budget({spend,setSpend,cap,setCap}){
      const [yuan,setYuan]=useState("");

      const add=(cat,amt)=>setSpend(bs=>[{id:"s"+Date.now()+Math.random().toString(36).slice(2,5),cat:cat||"",amt:amt||0},...bs]);
      const del=(id)=>setSpend(bs=>bs.filter(b=>b.id!==id));
      const yuanRp=Math.round((parseFloat(yuan)||0)*(Number(rate)||0));
      return (
        <div className="fade">
          <div className="card glow" style={{padding:"18px 20px",marginTop:12,background:"linear-gradient(135deg,var(--pink-500),var(--pink-400))",color:"#fff",border:"none"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
              <div>
                <div style={{fontSize:11,fontWeight:700,opacity:.9,letterSpacing:.3}}>TOTAL SPENDING</div>
                <div className="serif" style={{fontSize:30,fontWeight:700,lineHeight:1.1}}>{rupiah(total)}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:11,fontWeight:700,opacity:.9}}>BUDGET</div>
                <div style={{display:"flex",alignItems:"center",gap:2,background:"rgba(255,255,255,.2)",borderRadius:10,padding:"3px 8px",marginTop:2}}>
                  <span style={{fontWeight:800,fontSize:13}}>Rp</span>
                  <input inputMode="numeric" value={cap.toLocaleString("id-ID")}
                    onChange={e=>{const n=parseInt(e.target.value.replace(/\D/g,""),10);setCap(isNaN(n)?0:n);}}
                    style={{width:90,border:"none",background:"transparent",color:"#fff",fontWeight:800,fontSize:13,textAlign:"right"}}/>
                </div>
              </div>
            </div>
            <div className="progress-track" style={{background:"rgba(255,255,255,.25)",marginTop:14}}>
              <div className="progress-fill" style={{width:pct+"%",background:over?"#fff0f0":"#fff"}}></div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:9,fontSize:12,fontWeight:700}}>
              <span style={{opacity:.95}}>🧾 {spend.length} transaksi</span>
              <span style={{color:over?"#7a0017":"#fff",background:over?"rgba(255,255,255,.9)":"rgba(255,255,255,.18)",borderRadius:8,padding:"2px 8px"}}>
                {over? "Over "+rupiah(Math.abs(remain)) : "Sisa "+rupiah(remain)}
              </span>
            </div>
          </div>

          <div className="card" style={{padding:"13px 16px",marginTop:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontWeight:800,fontSize:13.5}}>🇨🇳 Konverter Yuan</span>
              <div style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:"var(--ink-soft)",fontWeight:600}}>
                ¥1 = Rp
                <input inputMode="numeric" value={rate.toLocaleString("id-ID")}
                  onChange={e=>{const n=parseInt(e.target.value.replace(/\D/g,""),10);setRate(isNaN(n)?0:n);}}
                  style={{width:54,border:"1px solid var(--line)",borderRadius:8,padding:"3px 6px",background:"var(--pink-50)",fontWeight:700,fontSize:12,textAlign:"right",color:"var(--pink-700)"}}/>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10}}>
              <div style={{display:"flex",alignItems:"center",gap:5,flex:1,border:"1px solid var(--line)",borderRadius:11,padding:"8px 11px",background:"var(--pink-50)"}}>
                <span style={{fontWeight:800,color:"var(--pink-600)"}}>¥</span>
                <input inputMode="decimal" value={yuan} placeholder="0" onChange={e=>setYuan(e.target.value.replace(/[^\d.]/g,""))}
                  style={{flex:1,minWidth:0,border:"none",background:"transparent",fontWeight:700,fontSize:14,color:"var(--ink)"}}/>
              </div>
              <span style={{color:"var(--muted)",fontWeight:800}}>=</span>
              <div style={{flex:1,fontWeight:800,fontSize:14,color:"var(--pink-700)",textAlign:"right"}}>{rupiah(yuanRp)}</div>
            </div>
            <button onClick={()=>{if(yuanRp>0){add("Belanja (¥"+yuan+")",yuanRp);setYuan("");}}}
              style={{width:"100%",marginTop:10,padding:"9px 0",background:"var(--pink-500)",color:"#fff",borderRadius:11,fontWeight:800,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6"><path d="M12 5v14M5 12h14"/></svg>
              Catat sebagai pengeluaran
            </button>
          </div>

          <div className="card" style={{padding:"8px 6px 6px",marginTop:12}}>
            {spend.length===0 && (
              <div style={{textAlign:"center",padding:"22px 16px",color:"var(--muted)"}}>
                <div style={{fontSize:30}}>🧾</div>
                <div style={{fontSize:13,fontWeight:600,marginTop:6,lineHeight:1.5}}>Belum ada pengeluaran.<br/>Tap <b>+ Tambah</b> atau pakai konverter ¥ buat mulai catat.</div>
              </div>
            )}
            {spend.map((b,i)=>(
              <div key={b.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 10px",borderBottom:i===spend.length-1?"none":"1px solid var(--pink-100)"}}>
                <span style={{flexShrink:0,width:30,height:30,borderRadius:9,background:"var(--pink-50)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>💸</span>
                <input value={b.cat} placeholder="Beli apa?" onChange={e=>upd(b.id,"cat",e.target.value)}
                  style={{flex:1,minWidth:0,border:"none",background:"transparent",fontSize:13.5,fontWeight:600,color:"var(--ink)"}}/>
                <AmtInput value={b.amt} onChange={v=>upd(b.id,"amt",v)}/>
                <button onClick={()=>del(b.id)} style={{flexShrink:0,color:"var(--pink-300)",padding:4}} aria-label="hapus">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
              </div>
            ))}
            <button onClick={()=>add()} style={{width:"100%",padding:"12px 0",color:"var(--pink-600)",fontWeight:800,fontSize:13.5,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6"><path d="M12 5v14M5 12h14"/></svg>
              Tambah pengeluaran
            </button>
          </div>
          <div style={{fontSize:11.5,color:"var(--muted)",marginTop:10,textAlign:"center",lineHeight:1.5}}>
            💡 Catat tiap kali belanja biar ketahuan sisa budget real-time. Kurs ¥ bisa kamu sesuaikan.
          </div>
        </div>
      );
    }

    /* ---------- Packing ---------- */
    function Packing({state,toggle}){
      const allKeys=PACK_GROUPS.flatMap((g,gi)=>g.items.map((_,ii)=>"p"+gi+"_"+ii));
      const done=allKeys.filter(k=>state[k]).length;
      const pct=Math.round(done/allKeys.length*100);
      return (
        <div className="fade">
          <div className="card" style={{padding:"16px 18px",marginTop:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <span style={{fontWeight:800,fontSize:15}}>📦 Packing List</span>
              <span style={{fontSize:13,fontWeight:700,color:"var(--pink-600)"}}>{done}/{allKeys.length}</span>
            </div>
            <div className="progress-track"><div className="progress-fill" style={{width:pct+"%"}}></div></div>
          </div>
          {PACK_GROUPS.map((g,gi)=>(
            <div key={gi} className="card" style={{padding:"14px 16px",marginTop:12}}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:10,display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:17}}>{g.emoji}</span>{g.g}
              </div>
              {g.items.map((it,ii)=>{
                const k="p"+gi+"_"+ii;
                return (
                  <button key={ii} onClick={(e)=>toggle(k,e)} className={"check "+(state[k]?"row-done":"")} style={{width:"100%",display:"flex",alignItems:"center",gap:11,padding:"8px 0",textAlign:"left"}}>
                    <span style={{flexShrink:0,width:22,height:22,borderRadius:7,border:"2px solid "+(state[k]?"var(--pink-500)":"var(--pink-200)"),background:state[k]?"var(--pink-500)":"#fff",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {state[k] && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5"><path d="M20 6 9 17l-5-5"/></svg>}
                    </span>
                    <span className="row-text" style={{fontSize:14,fontWeight:600}}>{it}</span>
                  </button>
                );
              })}
            </div>
          ))}
        </div>
      );
    }

    /* ---------- Tempat & Peta ---------- */
    function Places(){
      return (
        <div className="fade">
          {/* Arrival guide */}
          <div className="card" style={{padding:"18px 20px",marginTop:12,background:"linear-gradient(135deg,#fff,#fff1f6)"}}>
            <div className="serif" style={{fontSize:20,fontWeight:700,color:"var(--pink-700)"}}>📍 Dari Bandara → Kota</div>
            <div style={{fontSize:13,color:"var(--ink-soft)",marginTop:8,lineHeight:1.6}}>
              Mendarat di <b>Pudong (PVG T2)</b>, 05:45. Cara ke pusat kota / The Bund:
            </div>
            <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:8}}>
              {[
                ["🚕","Didi / Taksi","±45–60 mnt ke The Bund (¥150–200). Paling nyaman buat bumil + bagasi."],
                ["🚇","Metro Line 2","Langsung ke People's Square ±1 jam (¥7). Hindari jam sibuk."],
                ["🚄","Maglev","430 km/j ke Longyang Rd (±8 mnt), lanjut Metro Line 2."],
              ].map((x,i)=>(
                <div key={i} style={{display:"flex",gap:11,alignItems:"flex-start",background:"#fff",border:"1px solid var(--line)",borderRadius:13,padding:"10px 12px"}}>
                  <span style={{fontSize:18}}>{x[0]}</span>
                  <div><div style={{fontWeight:700,fontSize:13.5}}>{x[1]}</div><div style={{fontSize:12,color:"var(--ink-soft)",marginTop:1,lineHeight:1.4}}>{x[2]}</div></div>
                </div>
              ))}
            </div>
            <div style={{fontSize:12,color:"var(--ink-soft)",marginTop:11,lineHeight:1.55,background:"var(--pink-50)",border:"1px solid var(--line)",borderRadius:12,padding:"10px 12px"}}>
              💡 Begitu mendarat: aktifkan <b>e-SIM</b>, pasang <b>Alipay/WeChat Pay</b> (scan QR buat bayar apa aja), <b>Didi</b> (taksi online) & <b>Amap</b> (peta lokal—Google Maps diblokir di China). Siapkan sedikit cash RMB.
            </div>
          </div>

          {/* Wishlist places */}
          <div style={{fontWeight:800,fontSize:14,margin:"18px 4px 2px",color:"var(--ink)"}}>🗺️ Wishlist Tempat ({PLACES.length})</div>
          {PLACES.map((p,i)=>(
            <div key={i} className="card" style={{marginTop:11,overflow:"hidden"}}>
              <div style={{position:"relative"}}>
                <Photo tags={p.tags} lock={p.lock} emoji={p.emoji} h={140}/>
                <span style={{position:"absolute",left:10,bottom:10,fontSize:11,fontWeight:800,color:"#fff",background:p.color,borderRadius:8,padding:"4px 9px",boxShadow:"0 2px 8px rgba(0,0,0,.25)"}}>{p.day}</span>
              </div>
              <div style={{padding:"12px 16px 14px"}}>
                <div style={{fontWeight:800,fontSize:15,lineHeight:1.25}}>{p.n}</div>
                <div style={{fontSize:11.5,color:"var(--muted)",fontWeight:600,marginTop:3}}>📍 {p.area}</div>
                <div style={{fontSize:12.5,color:"var(--ink-soft)",marginTop:8,lineHeight:1.45}}>{p.tip}</div>
                <div style={{display:"flex",gap:8,marginTop:11}}>
                <a href={mapUrl(p.q)} target="_blank" rel="noopener" style={{flex:1,textDecoration:"none"}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:7,background:"var(--pink-500)",color:"#fff",borderRadius:12,padding:"10px 0",fontWeight:700,fontSize:13}}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M12 21s-6-5.7-6-10a6 6 0 0 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
                    Buka di Google Maps
                  </div>
                </a>
                {p.amap && (
                  <a href={p.amap} target="_blank" rel="noopener" style={{textDecoration:"none"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"center",background:"var(--pink-50)",color:"var(--pink-600)",border:"1px solid var(--line)",borderRadius:12,padding:"10px 14px",fontWeight:700,fontSize:13}}>Amap</div>
                  </a>
                )}
                </div>
              </div>
            </div>
          ))}

          {/* Halal food */}
          <div style={{fontWeight:800,fontSize:14,margin:"20px 4px 2px",color:"var(--ink)"}}>🍖 Makan Halal (dari panduan trip)</div>
          {HALAL.map((h,i)=>(
            <div key={i} className="card" style={{padding:"13px 16px",marginTop:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                <div style={{fontWeight:700,fontSize:14}}>{h.n}</div>
                <a href={mapUrl(h.n+" Shanghai")} target="_blank" rel="noopener" className="iconbtn" style={{textDecoration:"none",flexShrink:0}}>
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M12 21s-6-5.7-6-10a6 6 0 0 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
                </a>
              </div>
              <div style={{fontSize:12.5,color:"var(--ink-soft)",marginTop:3,lineHeight:1.45}}>{h.d}</div>
              <div style={{fontSize:11.5,color:"var(--muted)",marginTop:3}}>📌 {h.a}</div>
            </div>
          ))}
          <div style={{fontSize:11.5,color:"var(--muted)",marginTop:14,textAlign:"center",lineHeight:1.5}}>
            Catatan: di China, Google Maps sering diblokir — pakai <b>Amap</b> atau <b>Baidu Maps</b> saat di sana. Link di atas berguna buat rencana dari sekarang.
          </div>
        </div>
      );
    }

    /* ---------- Care ---------- */
    function Care({note,setNote}){
      return (
        <div className="fade">
          <div className="card" style={{padding:"18px 20px",marginTop:12,background:"linear-gradient(135deg,#fff,#fff1f6)"}}>
            <div className="serif" style={{fontSize:20,fontWeight:700,color:"var(--pink-700)"}}>Tips Bumil ke Shanghai 💗</div>
            <div style={{fontSize:13,color:"var(--ink-soft)",marginTop:4}}>Biar trip-nya aman & nyaman buat Bunda & dedek bayi.</div>
          </div>
          {TIPS.map((t,i)=>(
            <div key={i} className="card" style={{padding:"14px 16px",marginTop:11,display:"flex",gap:13}}>
              <div style={{width:40,height:40,borderRadius:12,background:"var(--pink-50)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{t.i}</div>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{t.t}</div>
                <div style={{fontSize:12.5,color:"var(--ink-soft)",marginTop:2,lineHeight:1.45}}>{t.d}</div>
              </div>
            </div>
          ))}
          <div className="card" style={{padding:"16px 18px",marginTop:14}}>
            <div style={{fontWeight:800,fontSize:14,marginBottom:9,display:"flex",gap:8,alignItems:"center"}}>💌 Catatan untuk dedek bayi</div>
            <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="Tulis harapan, perasaan, atau memori dari babymoon ini..."
              style={{width:"100%",minHeight:110,border:"1px solid var(--line)",borderRadius:14,padding:"12px 14px",fontSize:14,lineHeight:1.5,color:"var(--ink)",background:"var(--pink-50)"}}/>
            <div style={{fontSize:11,color:"var(--muted)",marginTop:6,textAlign:"right"}}>Tersimpan otomatis ✨</div>
          </div>
        </div>
      );
    }

    /* ---------- App ---------- */
    function App(){
      const init=load();
      const [tab,setTab]=useState("trip");
      const [state,setState]=useState(init.checks||{});
      const [note,setNote]=useState(init.note||"");
      const [spend,setSpend]=useState(init.spend||[]);
      const [cap,setCap]=useState(init.cap??DEFAULT_CAP);
      const [hotels,setHotels]=useState(init.hotels||[
        {id:"h0",name:"Hyatt on the Bund, Shanghai ⭐5",addr:"199 Huang Pu Rd, Hongkou · ☎ +86-21-63931234",ci:"21 Jun, 15:00",co:"22 Jun, before 12:00",conf:"Booking 1366685689 · Itinerary 9093383414980",note:"Pearl Tower River View King — view sungai. Sarapan 2 org, free wifi."},
        {id:"h1",name:"Pujing Waiting Hotel — People's Square",addr:"No. 219 Xinzha Rd, Huangpu District · ☎ +86-21-63357858",ci:"22 Jun, after 15:00",co:"25 Jun, before 14:00 (late check-out)",conf:"Conf 1367841482179301 · PIN 8014",note:"Zero Pressure Room, 1 queen bed, deep soaking bathtub. Sarapan 23–25. Lunas Rp 5.859.933."},
        {id:"h2",name:"",addr:"",ci:"25 Jun",co:"28 Jun",conf:"",note:"Penginapan 25–28 Jun (isi kalau sudah booking)"},
      ]);
      const [burst,setBurst]=useState(null);

      useEffect(()=>{save({checks:state,note,spend,cap,hotels});},[state,note,spend,cap,hotels]);

      const toggle=(k,e)=>{
        setState(s=>{
          const nv={...s,[k]:!s[k]};
          if(!s[k] && e){ setBurst({x:e.clientX,y:e.clientY}); }
          return nv;
        });
      };

      const allItin=DAYS.flatMap(d=>d.items.map(i=>i.k));
      const allPack=PACK_GROUPS.flatMap((g,gi)=>g.items.map((_,ii)=>"p"+gi+"_"+ii));
      const total=allItin.length+allPack.length;
      const done=[...allItin,...allPack].filter(k=>state[k]).length;

      const tabs=[
        {k:"trip",label:"Jadwal",ic:icons.cal},
        {k:"places",label:"Tempat",ic:icons.pin},
        {k:"budget",label:"Budget",ic:icons.wallet},
        {k:"pack",label:"Packing",ic:icons.bag},
        {k:"care",label:"Bumil",ic:icons.heart},
      ];

      return (
        <div className="app">
          <HeartBurst fire={burst}/>
          <Hero done={done} total={total}/>
          <div className="seg" style={{marginTop:16}}>
            {tabs.map(t=>(
              <button key={t.k} className={tab===t.k?"on":""} onClick={()=>setTab(t.k)}>{t.label}</button>
            ))}
          </div>
          {tab==="trip" && <Itinerary state={state} toggle={toggle}/>}
          {tab==="places" && <Places/>}
          {tab==="budget" && <Budget spend={spend} setSpend={setSpend} cap={cap} setCap={setCap}/>}
          {tab==="pack" && <Packing state={state} toggle={toggle}/>}
          {tab==="care" && <Care note={note} setNote={setNote}/>}

          <div style={{textAlign:"center",marginTop:28,fontSize:12,color:"var(--muted)",fontWeight:600}}>
            Dibuat dengan 💗 untuk Rafa & dedek bayi
          </div>

          <div className="navbar">
            <div className="navinner">
              {tabs.map(t=>(
                <button key={t.k} className={"navbtn tabbtn "+(tab===t.k?"on":"")} onClick={()=>setTab(t.k)}>
                  <Ic d={t.ic}/>{t.label}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
